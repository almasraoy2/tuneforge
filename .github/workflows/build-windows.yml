name: Build TuneForge (Windows)

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -G "Visual Studio 17 2022" -A x64

      - name: Build VST3 and Standalone
        run: |
          cmake --build build --config Release --target TuneForge_VST3 --parallel
          cmake --build build --config Release --target TuneForge_Standalone --parallel

      - name: Collect files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item -Recurse -Force "build/TuneForge_artefacts/Release/VST3/TuneForge.vst3" "dist/TuneForge.vst3"
          Copy-Item -Force "build/TuneForge_artefacts/Release/Standalone/TuneForge.exe" "dist/TuneForge-Standalone.exe"

      - uses: actions/upload-artifact@v4
        with:
          name: TuneForge-Windows
          path: dist
